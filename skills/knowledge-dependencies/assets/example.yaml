      path: research/example/example-source.md
      locator: Uniform hypothesis
    requires: [ambient]
  - id: ambient
    kind: definition
    statement: x is a real sequence indexed by natural numbers.
    source:
      path: research/example/example-source.md
      locator: Ambient objects
    requires: []
    references: [conclusion]
